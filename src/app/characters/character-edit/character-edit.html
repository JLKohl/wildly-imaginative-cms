<h2>Save Character</h2>

<div class="form-container">

    <form (ngSubmit)="updateCharacter()">

    <label>Name:</label>
    <input 
        type="text"
        [(ngModel)]="character.name"
        name="name"
    >

    <label>Age:</label>
    <input 
        type="number"
        [(ngModel)]="character.age"
        name="age"
    >

    <label>Eye Color:</label>
    <input 
        type="text"
        [(ngModel)]="character.eyeColor"
        name="eyeColor"
    >

    <label>Hair Color:</label>
    <input 
        type="text"
        [(ngModel)]="character.hairColor"
        name="hairColor"
    >

    <label>Occupation:</label>
    <input 
        type="text"
        [(ngModel)]="character.occupation"
        name="occupation"
    >

    <label>Image URL:</label>
    <input 
        type="text"
        [(ngModel)]="character.imageUrl"
        name="imageUrl"
    >

    <label>Description:</label>
    <textarea
        [(ngModel)]="character.description"
        name="description">
    </textarea>

    <button type="submit">
        Save Changes
    </button>

    </form>

</div>

<a class="button" routerLink="/characters">
  Back to Characters
</a>
