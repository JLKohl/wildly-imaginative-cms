@if (character()) {

    <h2>{{ character()?.name }}</h2>
  
    <p><strong>Age:</strong> {{ character()?.age }}</p>
  
    <p><strong>Eye Color:</strong> {{ character()?.eyeColor }}</p>
  
    <p><strong>Hair Color:</strong> {{ character()?.hairColor }}</p>
  
    <p><strong>Occupation:</strong> {{ character()?.occupation }}</p>
  
    <p>{{ character()?.description }}</p>

    <a

    class="button"
    [routerLink]="['/characters', 'edit', character()?._id]">
    Edit Character

    </a>

    <button 
      class="button delete-button"
      (click)="deleteCharacter()">
      Delete Character
    </button>

    <a class="button" routerLink="/characters">
      Back to Characters
    </a>
  
  }
